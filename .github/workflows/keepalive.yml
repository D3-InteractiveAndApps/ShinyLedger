# Shiny Ledger keep-alive: pings Supabase twice a week so the free project isn't paused
# for inactivity. Create this in GitHub as .github/workflows/keepalive.yml
# (Actions tab → "set up a workflow yourself"), then paste this whole file in.
name: Supabase keep-alive
on:
  schedule:
    - cron: "17 9 * * 1,4"   # Mondays and Thursdays, 09:17 UTC
  workflow_dispatch: {}      # adds a "Run workflow" button for testing
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          URL=$(curl -fsS https://d3-interactiveandapps.github.io/ShinyLedger/config.js | grep -o 'supabaseUrl: *"[^"]*"' | sed 's/.*"\(.*\)"/\1/')
          KEY=$(curl -fsS https://d3-interactiveandapps.github.io/ShinyLedger/config.js | grep -o 'supabaseAnonKey: *"[^"]*"' | sed 's/.*"\(.*\)"/\1/')
          test -n "$URL" && test -n "$KEY"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/profiles?select=user_id&limit=1" -H "apikey: $KEY")
          echo "Supabase answered $code"
          test "$code" = "200"
