<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Track shiny hunts for every Pokémon game, with live odds, RNG tools and themes.">
<meta name="theme-color" content="#16181d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shiny Ledger">
<link rel="manifest" href="manifest.webmanifest?v=4">
<link rel="icon" href="favicon-v2.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="favicon-v2.svg">
<link rel="apple-touch-icon" sizes="180x180" href="touch-180-v3.png">
<link rel="apple-touch-icon" sizes="167x167" href="touch-167-v3.png">
<link rel="apple-touch-icon" sizes="152x152" href="touch-152-v3.png">
<link rel="apple-touch-icon" sizes="120x120" href="touch-120-v3.png">
<title>Shiny Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Press+Start+2P&family=Pixelify+Sans:wght@500;700&family=Cinzel:wght@600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: chrome bar with tabs on top; Hunts tab = hunt list rail + one big counter workspace; other tabs are single-column tool pages. Skins swap every token below. */
:root{
  --chrome:#16181d; --chrome-ink:#ffffff;
  --bg:#f3f4f6; --panel:#ffffff; --panel2:#eceef2;
  --ink:#16181d; --muted:#5b6270; --line:#dde0e6;
  --accent:#cf3328; --on-accent:#ffffff; --spark:#b8860b;
  --good:#1f8a4c; --warn:#a86400; --bad:#c0392b;
  --font-display:"Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --font-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --dscale:1;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --chrome:#0a0b0e; --chrome-ink:#f2f3f5;
    --bg:#0f1115; --panel:#171a20; --panel2:#1f232b;
    --ink:#eceef2; --muted:#9aa1ad; --line:#2a2f38;
    --accent:#ff5a4e; --on-accent:#140605; --spark:#ffcc4d;
    --good:#4fd08a; --warn:#ffb347; --bad:#ff6b5e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --chrome:#0a0b0e; --chrome-ink:#f2f3f5;
  --bg:#0f1115; --panel:#171a20; --panel2:#1f232b;
  --ink:#eceef2; --muted:#9aa1ad; --line:#2a2f38;
  --accent:#ff5a4e; --on-accent:#140605; --spark:#ffcc4d;
  --good:#4fd08a; --warn:#ffb347; --bad:#ff6b5e;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;margin:0;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.15}
h2{font-size:calc(1.35rem * var(--dscale))}
h3{font-size:calc(1.05rem * var(--dscale))}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

/* chrome */
.chrome{background:var(--chrome);color:var(--chrome-ink);position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:20;border-bottom:1px solid var(--line)}
.chrome-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.syncpill{display:inline-flex;align-items:center;gap:7px;border:1px solid color-mix(in srgb,var(--chrome-ink) 30%,transparent);background:transparent;color:var(--chrome-ink);border-radius:99px;padding:5px 11px;font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap;order:3}
.syncpill i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.55;flex:none}
.syncpill[data-s="synced"] i{background:#3ecf8e;opacity:1}
.syncpill[data-s="saving"] i{background:#f5b942;opacity:1}
.syncpill[data-s="offline"] i{background:#9aa3ad;opacity:1}
.syncpill[data-s="error"] i{background:#ff6b5e;opacity:1}
.skin-pick{order:4}
.syncpill[data-s="signedout"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.brand svg{width:28px;height:28px;flex:none}
.brand b{font-family:var(--font-display);font-size:calc(1.2rem * var(--dscale));letter-spacing:.02em}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:none;border:0;color:var(--chrome-ink);opacity:.72;padding:7px 11px;border-radius:7px;cursor:pointer;font-weight:600;font-size:.88rem}
.tabs button:hover{opacity:1}
.tabs button[aria-selected="true"]{opacity:1;background:color-mix(in srgb,var(--chrome-ink) 16%,transparent)}
.skin-pick{display:flex;align-items:center;gap:6px;font-size:.8rem}
.skin-pick select{background:color-mix(in srgb,var(--chrome-ink) 12%,transparent);border:1px solid color-mix(in srgb,var(--chrome-ink) 30%,transparent);color:var(--chrome-ink);border-radius:7px;padding:5px 8px;max-width:170px}
.skin-pick select option{color:#111;background:#fff}

main{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
.page{display:grid;gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}

.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:.88rem;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:grid;gap:4px;font-size:.8rem;color:var(--muted);font-weight:600;min-width:0}
label.f input,label.f select,label.f textarea,.inp{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-weight:400;font-size:.92rem;width:100%;min-width:0}
textarea{resize:vertical}
.check{display:flex;align-items:center;gap:8px;font-size:.88rem;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}

/* stats strip */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--panel);padding:12px 16px}
.stat .v{font-family:var(--font-display);font-size:calc(1.5rem * var(--dscale));font-weight:700;font-variant-numeric:tabular-nums}
.stat .v.spark{color:var(--spark)}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border:1px dashed var(--spark);border-radius:var(--r);background:color-mix(in srgb,var(--spark) 9%,var(--panel));font-size:.9rem}
.banner b{color:var(--ink)}

.hunts{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:880px){.hunts{grid-template-columns:minmax(0,1fr)}}
.rail{display:grid;gap:10px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:6px 4px;border-radius:6px;cursor:pointer;font-size:.8rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.hlist{display:grid;gap:6px;max-height:min(70vh,760px);overflow:auto;padding-right:2px}
.hitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;width:100%}
.hitem:hover{border-color:var(--muted)}
.hitem[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.hitem .t{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hitem .s{display:block;font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hitem .c{font-family:var(--font-mono);font-size:.85rem;font-variant-numeric:tabular-nums;text-align:right}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.st-active{background:var(--accent)} .st-paused{background:var(--muted)} .st-complete{background:var(--spark)} .st-failed{background:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--panel2)}
.pill.complete{color:var(--spark);border-color:var(--spark)}
.pill.active{color:var(--accent);border-color:var(--accent)}
.pill.failed{color:var(--bad);border-color:var(--bad)}

/* detail */
.detail{display:grid;gap:16px;min-width:0}
.dhead{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.dhead h2{font-size:calc(1.8rem * var(--dscale))}
.meta{color:var(--muted);font-size:.88rem;margin-top:4px}
.counter{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0}
@media (max-width:720px){.counter{grid-template-columns:minmax(0,1fr)}}
.cmain{padding:22px;border-right:1px solid var(--line);display:grid;gap:14px;align-content:start}
@media (max-width:720px){.cmain{border-right:0;border-bottom:1px solid var(--line)}}
.count{font-family:var(--font-display);font-size:calc(clamp(3.6rem,10vw,6.2rem) * var(--dscale));font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.count.bump{animation:bump .18s ease-out}
@keyframes bump{from{transform:translateY(-3px)}to{transform:none}}
.cbtns{display:flex;gap:8px;flex-wrap:wrap}
.cbtns .big{font-size:1.15rem;padding:14px 22px;min-width:120px}
.chainbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
.chainbox .cv{font-family:var(--font-mono);font-size:1.25rem;font-weight:600;min-width:3ch}
.codds{padding:22px;display:grid;gap:12px;align-content:start}
.live{display:grid;gap:6px}
.livepct{font-family:var(--font-display);font-size:calc(2rem * var(--dscale));font-weight:700;color:var(--spark);font-variant-numeric:tabular-nums;line-height:1.1}
.oddsbig{font-family:var(--font-mono);font-size:1.7rem;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.88rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right}
.track{width:100%;height:auto;display:block}
.track .area{fill:color-mix(in srgb,var(--accent) 14%,transparent)}
.track .curve{fill:none;stroke:var(--accent);stroke-width:2}
.track .grid{stroke:var(--line);stroke-width:1}
.track .ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.track .now{stroke:var(--spark);stroke-width:2}
.track .nowdot{fill:var(--spark)}
.track text{fill:var(--muted);font-family:var(--font-mono);font-size:11px}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.timer{font-family:var(--font-mono);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.phases{display:grid;gap:6px;margin:0;padding:0;list-style:none;max-height:220px;overflow:auto}
.phases li{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;padding:6px 10px;border-radius:7px;background:var(--panel2)}
.empty{padding:40px 22px;text-align:center;display:grid;gap:12px;justify-items:center}
.kbd{font-family:var(--font-mono);font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--panel2)}
.found{position:relative;overflow:hidden}
.found::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 30%,color-mix(in srgb,var(--spark) 22%,transparent) 0 6%,transparent 7%),radial-gradient(circle at 70% 20%,color-mix(in srgb,var(--spark) 18%,transparent) 0 4%,transparent 5%),radial-gradient(circle at 85% 70%,color-mix(in srgb,var(--spark) 20%,transparent) 0 5%,transparent 6%)}
.burst{animation:burst 1.1s ease-out}
@keyframes burst{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--spark) 70%,transparent)}100%{box-shadow:0 0 0 26px transparent}}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,10,14,.55);display:grid;place-items:start center;padding:6vh 16px;z-index:50;overflow:auto}
.modal{width:min(640px,100%);display:grid;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.mods{display:flex;gap:14px;flex-wrap:wrap;align-items:end}
.combo{position:relative;display:grid;gap:4px;font-size:.8rem;color:var(--muted);font-weight:600;min-width:0}
.combolist{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;max-height:260px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:5}
.combolist li{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--ink);font-weight:500;font-size:.9rem}
.combolist li[aria-selected="true"],.combolist li[data-id]:hover{background:var(--panel2)}
.combolist li.none{color:var(--muted);cursor:default}
.oddsprev{font-family:var(--font-mono);padding:10px 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:.9rem}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--panel2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.hit td{background:color-mix(in srgb,var(--spark) 14%,transparent)}
.best{color:var(--spark);font-weight:700}

/* rng */
.gen{display:grid;gap:10px}
.gen h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.gen .tag{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);font-weight:500}
.gen p,.gen ul{margin:0;font-size:.9rem;max-width:72ch}
.gen ul{padding-left:18px}
.tool{display:grid;gap:12px}
.out{font-family:var(--font-mono);font-size:.9rem;padding:10px 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);overflow-wrap:anywhere}
.out.yes{border-color:var(--spark);color:var(--ink);background:color-mix(in srgb,var(--spark) 14%,var(--panel))}
.tfields{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.clock{font-family:var(--font-mono);font-size:clamp(2.4rem,8vw,3.6rem);font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.subnav{display:flex;gap:6px;flex-wrap:wrap}
.subnav button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:.82rem;font-weight:600}
.subnav button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* themes */
.skingroup{display:grid;gap:10px}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.sw{border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;padding:0;text-align:left;background:var(--panel)}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.sw .top{height:22px;display:flex;align-items:center;padding:0 8px;gap:5px}
.sw .top i{width:6px;height:6px;border-radius:50%;display:block}
.sw .body{padding:10px;display:grid;gap:6px}
.sw .card{border-radius:6px;padding:7px 8px;display:flex;justify-content:space-between;align-items:center;font-size:.8rem}
.sw .n{font-weight:600;font-size:.82rem;padding:8px 10px;border-top:1px solid var(--line);color:var(--ink);background:var(--panel)}
.note{font-size:.84rem;color:var(--muted);max-width:75ch}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:.88rem;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.25)}

/* ---------- touch & phone ---------- */
button,a,.count,.tap{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (min-width:721px){.only-m{display:none!important}}
.mswitch{display:none}
.bnav{display:none}
.mbar{display:none}
.sheet-scrim{display:none}
@media (hover:none){.btn:hover,.hitem:hover{border-color:var(--line)}}
@media (max-width:720px){
  .only-d{display:none!important}
  body{font-size:16px}
  label.f input,label.f select,label.f textarea,.inp,.skin-pick select{font-size:16px}
  .chrome-in{flex-wrap:nowrap;padding-block:8px}
  .chrome .tabs{display:none}
  .brand b{font-size:calc(1.05rem * var(--dscale))}
  .skin-pick span{display:none}
  .skin-pick select{max-width:27vw}
  .syncpill{padding:0;width:36px;height:36px;justify-content:center;flex:none}
  .syncpill i{width:10px;height:10px}
  .syncpill span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .syncpill[data-s="signedout"]{width:auto;padding:0 14px;background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .syncpill[data-s="signedout"] i{display:none}
  .syncpill[data-s="signedout"] span{position:static;width:auto;height:auto;clip:auto}
  .brand b{overflow:hidden;text-overflow:ellipsis}
  .brand b{white-space:nowrap}
  main{padding-block:14px calc(160px + env(safe-area-inset-bottom,0px))}
  .page{gap:14px}
  h2{font-size:calc(1.2rem * var(--dscale))}
  .pad{padding:14px}
  .btn{padding:10px 14px;min-height:42px}
  /* bottom tab bar */
  .chrome-in{gap:8px}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--chrome);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bnav button{background:none;border:0;color:var(--chrome-ink);opacity:.62;display:grid;justify-items:center;gap:2px;padding:8px 2px 7px;font-size:.68rem;font-weight:600;cursor:pointer;min-height:54px}
  .bnav button svg{width:22px;height:22px}
  .bnav button[aria-selected="true"]{opacity:1}
  .bnav button[aria-selected="true"] svg{color:var(--star,var(--spark))}
  /* stats scroll row */
  .stats{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .stats::-webkit-scrollbar{display:none}
  .stat{flex:0 0 auto;min-width:138px;scroll-snap-align:start;padding:10px 14px}
  .stat .v{font-size:calc(1.25rem * var(--dscale))}
  /* hunt list becomes a bottom sheet */
  .mswitch{display:flex;gap:8px}
  .mswitch .btn{flex:1;display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
  .mswitch .btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .sheet-scrim{display:block;position:fixed;inset:0;z-index:44;background:rgba(10,10,14,.5)}

  .cmain,.codds{padding:16px}
  .cbtns .tapbtn{display:none}
  .chainbox .btn{min-width:44px}
  /* fixed counter bar in thumb reach */

  .mbar .plus small{font-family:var(--font-mono);font-size:.82rem;opacity:.85;font-weight:500}

  .scrim{padding:0;place-items:end stretch}

  .tw.stack{border:0;overflow:visible}

  .skins{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}

function oddsOf(gk,mid,mods,chain){
  const g=GAMES[gk],m=METHOD[mid];if(!g||!m)return {p:null};
  const r=m.fn(g,mods||{},chain||0);
  if(r.target)return {target:true};
  if(r.rolls){r.p=R(r.rolls,g.base)}
  return r;
}
function huntOdds(h){
  if(h.oddsOverride>0)return {p:1/h.oddsOverride,custom:true};
  return oddsOf(h.game,h.method,h.mods,h.chain);
}
function bestFor(gk,m){
  const mods={charm:true,research:3,outbreak:25,spark:3,donut:3,lure:true};
  return oddsOf(gk,m.id,mods,m.chainMax||0);
}

/* ============ cloud sync (Supabase) — offline-first ============
   Every change is written to this device first, queued in an outbox,
   and pushed to Supabase when signed in and online. Deletes are soft
   (deleted=true) so other devices learn about them. Last write wins,
   compared by each hunt's own `updated` timestamp. */
const CFG=window.SHINY_CONFIG||{};
const sb=(CFG.supabaseUrl&&CFG.supabaseAnonKey&&window.supabase)?window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'shinyledger.auth'}}):null;
const LS_OUT='shinyledger.outbox', LS_TOMB='shinyledger.tombs', LS_OWNER='shinyledger.owner';

const Store={
  mode:'local',user:null,channel:null,timer:null,busy:false,again:false,status:'local',
  outbox:new Set(lsGet(LS_OUT)||[]),
  tombs:new Set(lsGet(LS_TOMB)||[]),
  saveOut(){lsSet(LS_OUT,[...this.outbox]);lsSet(LS_TOMB,[...this.tombs])},
  setStatus(st){this.status=st;renderSync()},
  async connect(){
    if(!sb){this.setStatus('local');return}
    this.setStatus('signedout');
    try{const {data}=await sb.auth.getSession();await this.onSession(data.session)}catch(e){this.setStatus('error')}
    sb.auth.onAuthStateChange((_ev,session)=>{setTimeout(()=>this.onSession(session),0)});
    window.addEventListener('online',()=>{if(this.user){this.flush();this.pull()}});
    window.addEventListener('offline',()=>{if(this.user)this.setStatus('offline')});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&this.user){this.flush();this.pull()}});
  },
  async onSession(session){
    const u=session&&session.user||null;
    if((u&&u.id)===(this.user&&this.user.id))return;
    if(this.channel){try{sb.removeChannel(this.channel)}catch(e){}this.channel=null}
    this.user=u;
    if(!u){this.mode='local';S.mode='local';this.setStatus('signedout');renderHunts();return}
    this.mode='cloud';S.mode='cloud';
    const prev=lsGet(LS_OWNER);
    if(prev&&prev!==u.id){
      // A different account used this device before: its hunts already live in its cloud. Start clean.
      S.hunts=new Map();this.outbox.clear();this.tombs.clear();persistLocal();
    }else if(prev!==u.id){
      // Guest hunts on this device: upload them to the new account.
      realHunts().forEach(h=>this.outbox.add(h.id));
    }
    lsSet(LS_OWNER,u.id);this.saveOut();
    await this.flush();await this.pull();this.subscribe();this.loadProfile();renderHunts();
  },
  async pull(){
    if(!this.user)return;
    if(!navigator.onLine){this.setStatus('offline');return}
    const {data,error}=await sb.from('hunts').select('id,data,deleted');
    if(error){this.setStatus('error');return}
    const local=new Map(realHunts().map(h=>[h.id,h]));
    const next=new Map();
    for(const row of data){
      const loc=local.get(row.id),dirty=this.outbox.has(row.id);
      if(row.deleted){if(dirty&&loc&&!this.tombs.has(row.id))next.set(row.id,loc);continue}
      if(this.tombs.has(row.id))continue;
      const remote=row.data||{};
      next.set(row.id,(loc&&dirty&&(loc.updated||0)>=(remote.updated||0))?loc:remote);
    }
    for(const [id,h] of local){if(!next.has(id)&&this.outbox.has(id)&&!this.tombs.has(id))next.set(id,h)}
    setHunts(next);
    this.setStatus(this.outbox.size?'saving':'synced');
  },
  subscribe(){
    if(!this.user)return;
    this.channel=sb.channel('hunts-'+this.user.id)
      .on('postgres_changes',{event:'*',schema:'public',table:'hunts',filter:'user_id=eq.'+this.user.id},p=>this.onRemote(p.new))
      .subscribe();
  },
  onRemote(row){
    if(!row||!row.id)return;
    const loc=S.hunts.get(row.id),dirty=this.outbox.has(row.id);
    if(row.deleted){if(dirty)return;if(loc){S.hunts.delete(row.id);if(S.sel===row.id)S.sel=pickDefault();afterRemote()}return}
    const r=row.data||{};
    if(loc&&(loc.updated||0)>=(r.updated||0))return; // our own echo or older
    if(dirty)return;
    if(S.examples)clearExamples();
    S.hunts.set(row.id,r);if(!S.sel)S.sel=row.id;afterRemote();
  },
  save(h,now){
    if(!h||h.example)return;
    h.updated=Date.now();
    this.outbox.add(h.id);this.saveOut();persistLocal();
    if(!this.user)return;
    this.setStatus(navigator.onLine?'saving':'offline');
    clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),now?0:700);
  },
  remove(id){
    this.tombs.add(id);this.outbox.add(id);this.saveOut();persistLocal();
    if(this.user){clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),0)}
  },
  async flush(){
    if(!this.user||!this.outbox.size)return;
    if(!navigator.onLine){this.setStatus('offline');return}
    if(this.busy){this.again=true;return}
    this.busy=true;this.setStatus('saving');
    const ids=[...this.outbox],sent={};
    const rows=ids.map(id=>{
      if(this.tombs.has(id))return {id,user_id:this.user.id,data:{},deleted:true,updated_at:new Date().toISOString()};
      const h=S.hunts.get(id);if(!h||h.example)return null;
      sent[id]=h.updated||0;
      return {id,user_id:this.user.id,data:plain(h),deleted:false,updated_at:new Date(h.updated||Date.now()).toISOString()};
    }).filter(Boolean);
    let ok=true;
    if(rows.length){const {error}=await sb.from('hunts').upsert(rows,{onConflict:'id'});if(error)ok=false}
    if(ok){
      ids.forEach(id=>{const h=S.hunts.get(id);if(this.tombs.has(id)||!h||(h.updated||0)===sent[id]){this.outbox.delete(id);this.tombs.delete(id)}});
      this.saveOut();
    }
    this.busy=false;this.again=false;
    if(!ok){this.setStatus('error');return}
    if(this.outbox.size){setTimeout(()=>this.flush(),300);return}
    this.setStatus('synced');
  },
  async loadProfile(){
    try{const {data}=await sb.from('profiles').select('skin').eq('user_id',this.user.id).maybeSingle();
      if(data&&data.skin&&data.skin!==S.skin)applySkin(data.skin,false)}catch(e){}

  },
  async signOut(){try{await this.flush();await sb.auth.signOut()}catch(e){}}
};

function lum(h){const c=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function contrast(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
const SKIN_ALIAS={electric:'pikachu',firelizard:'charizard',seaturtle:'blastoise',seedtoad:'venusaur',ghost:'gengar',psychic:'mewtwo',rage:'redgyarados'};
function applySkin(id,save=true){
  id=SKIN_ALIAS[id]||id;S.skin=id;const b=document.body;
  const props=['star','chrome','chrome-ink','bg','panel','panel2','ink','muted','line','accent','on-accent','spark','good','warn','bad','font-display','dscale'];
  props.forEach(p=>b.style.removeProperty('--'+p));b.style.removeProperty('color-scheme');
  const sk=SKIN[id];

function trackSVG(p,c){
  const W=600,H=96,L=6,Rr=6,T=8,B=22;
  const c99=needFor(p,.99);
  const maxX=Math.max(c99,Math.ceil(c*1.08),10);
  const x=n=>L+(W-L-Rr)*n/maxX, y=q=>T+(H-T-B)*(1-q);
  let d='';const steps=80;
  for(let i=0;i<=steps;i++){const n=maxX*i/steps;d+=(i?'L':'M')+x(n).toFixed(1)+' '+y(cum(p,n)).toFixed(1)}
  const area=d+`L${x(maxX)} ${y(0)}L${x(0)} ${y(0)}Z`;
  const refs=[.5,.9].map(q=>{const n=needFor(p,q);return `<line class="ref" x1="${x(n)}" x2="${x(n)}" y1="${T}" y2="${H-B}"/><text x="${x(n)+3}" y="${T+10}">${q*100}%</text>`}).join('');
  const nx=x(Math.min(c,maxX)),ny=y(cum(p,c));
  return `<svg class="track" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative chance curve; you are at ${pct(cum(p,c))}">
   <line class="grid" x1="${L}" x2="${W-Rr}" y1="${y(0)}" y2="${y(0)}"/>
   <path class="area" d="${area}"/><path class="curve" d="${d}"/>${refs}
   <line class="now" x1="${nx}" x2="${nx}" y1="${T}" y2="${H-B}"/><circle class="nowdot" cx="${nx}" cy="${ny}" r="5"/>
   <text x="${L}" y="${H-6}">0</text><text x="${W-Rr}" y="${H-6}" text-anchor="end">${num(maxX)} enc.</text>
  </svg>`;
}

function updateFocus(){
  const root=$('#focusRoot');const h=cur();

function wireUpBtn(){

function touch(h,full=true){Store.save(h);if(full){renderHunts();if(S.focus)updateFocus()}}
function bump(n){
  const h=cur();if(!h||h.status==='complete')return;
  h.count=Math.max(0,(h.count||0)+n);
  const m=METHOD[h.method];
  if(m&&m.chain&&h.linkChain)h.chain=Math.max(0,(h.chain||0)+(n>0?1:-1));
  if(h.status==='paused'&&n>0)h.status='active';
  buzz(n>0?12:[8,40,8]);

document.addEventListener('click',e=>{

    case 'found':if(h){h.status='complete';h.completed=Date.now();if(h.runningSince){h.timeMs=huntTime(h);h.runningSince=null}touch(h);buzz([30,60,30,60,120]);const cp=$('#counterPanel');if(cp)cp.classList.add('burst');toast('Shiny logged at '+num(h.count)+'!')}break;
    case 'timer':if(h){if(h.runningSince){h.timeMs=huntTime(h);h.runningSince=null}else h.runningSince=Date.now();touch(h)}break;
    case 'phase':{const v=$('#phaseIn').value.trim();if(h){(h.phases=h.phases||[]).push({at:h.count||0,species:v||'Unknown',date:Date.now()});touch(h)}break}

    case 'del':
      if(!h)break;
      if(t.dataset.armed){S.hunts.delete(h.id);if(!h.example)Store.remove(h.id);else if(![...S.hunts.values()].some(x=>x.example))S.examples=false;S.sel=pickDefault();if(Store.mode!=='db')persistLocal();renderHunts();toast('Hunt deleted')}
      else{t.dataset.armed='1';t.textContent='Confirm delete';t.classList.add('armed');setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent='Delete';t.classList.remove('armed')}},3500)}
      break;
    case 'gotoRng':setTab('rng');break;
    case 'sheet':S.sheet=true;renderHunts();break;

    case 'sheetclose':S.sheet=false;renderHunts();break;

/* ============ mods fields (shared) ============ */
function modsFields(prefix,gk,mid,vals){
  const g=GAMES[gk],m=METHOD[mid];if(!m)return '';
  return m.mods.filter(k=>!(k==='charm'&&!g.charm)).map(k=>{
    const d=MODDEF[k],id=prefix+'_'+k;
    if(d.type==='check')return `<label class="check"><input type="checkbox" id="${id}" data-mod="${k}" ${vals&&vals[k]?'checked':''}> ${d.label}${k==='charm'?` <span class="muted">(+${g.charm})</span>`:''}</label>`;
    return `<label class="f" for="${id}">${d.label}<select id="${id}" data-mod="${k}">${d.opts.map(([v,l])=>`<option value="${v}" ${vals&&+vals[k]===v?'selected':''}>${l}</option>`).join('')}</select></label>`;
  }).join('');
}
function readMods(root){const o={};$$('[data-mod]',root).forEach(el=>{o[el.dataset.mod]=el.type==='checkbox'?el.checked:+el.value});return o}
function gameOptions(sel){
  const gens={};GKEYS.forEach(k=>{(gens[GAMES[k].gen]=gens[GAMES[k].gen]||[]).push(k)});

function methodOptions(gk,sel){return methodsFor(gk).map(m=>`<option value="${m.id}" ${m.id===sel?'selected':''}>${esc(m.n)}</option>`).join('')}

function renderOddsOut(){
  const g=GAMES[OL.game],m=METHOD[OL.method];
  const o=oddsOf(OL.game,OL.method,OL.mods,OL.chain);
  const rows=methodsFor(OL.game).filter(x=>x.id!=='rng').map(x=>({m:x,b:bestFor(OL.game,x)})).sort((a,b)=>(b.b.p||0)-(a.b.p||0));
  const top=rows[0];
  let main;

        <div class="tw"><table><thead><tr><th>Chance of a shiny</th><th class="num">Encounters needed</th></tr></thead><tbody>
          ${qs.map(q=>`<tr><td>${q*100}%</td><td class="num">${num(needFor(o.p,q))}</td></tr>`).join('')}
        </tbody></table></div>
      </div>

  }

       ${RNG_GAMES.includes(OL.game)?`<tr><td><b>RNG manipulation</b></td><td class="num" data-label="Base">—</td><td class="num" data-label="Best case">Targeted</td><td>${esc(METHOD.rng.d)}</td></tr>`:''}
     </tbody></table></div>
   </div>`;
}
function bigCurve(p){
  const W=560,H=240,L=46,Rr=14,T=12,B=34;
  const maxX=needFor(p,.99);
  const x=n=>L+(W-L-Rr)*n/maxX,y=q=>T+(H-T-B)*(1-q);
  let d='';for(let i=0;i<=120;i++){const n=maxX*i/120;d+=(i?'L':'M')+x(n).toFixed(1)+' '+y(cum(p,n)).toFixed(1)}
  const yt=[0,.25,.5,.75,1].map(q=>`<line class="grid" x1="${L}" x2="${W-Rr}" y1="${y(q)}" y2="${y(q)}"/><text x="${L-6}" y="${y(q)+4}" text-anchor="end">${q*100}%</text>`).join('');
  const xt=[0,.25,.5,.75,1].map(f=>`<text x="${x(maxX*f)}" y="${H-12}" text-anchor="${f===0?'start':f===1?'end':'middle'}">${num(Math.round(maxX*f))}</text>`).join('');
  const one=1/p;const marks=one<maxX?`<line class="ref" x1="${x(one)}" x2="${x(one)}" y1="${T}" y2="${H-B}"/><circle class="nowdot" cx="${x(one)}" cy="${y(cum(p,one))}" r="4"/><text x="${x(one)+5}" y="${y(cum(p,one))+14}">1× odds · 63%</text>`:'';
  return `<div style="overflow-x:auto"><svg class="track" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative chance of a shiny by encounter count">${yt}<path class="area" d="${d}L${x(maxX)} ${y(0)}L${x(0)} ${y(0)}Z"/><path class="curve" d="${d}"/>${marks}${xt}</svg></div>`;
}

/* ============ RNG LAB ============ */
const NATURES=['Hardy','Lonely','Brave','Adamant','Naughty','Bold','Docile','Relaxed','Impish','Lax','Timid','Hasty','Serious','Jolly','Naive','Modest','Mild','Quiet','Bashful','Rash','Calm','Gentle','Sassy','Careful','Quirky'];

const hex=(n,w=8)=>(n>>>0).toString(16).toUpperCase().padStart(w,'0');

     <p class="note" style="margin:0">External tools: ${gi.ext.map(lk).join(' · ')}</p></div>

  $$('[data-gen]',el).forEach(b=>b.addEventListener('click',()=>{RL.gen=+b.dataset.gen;if(TM.running)stopTimer();TM.mode=defaultTimerMode();renderRng()}));

function defaultTimerMode(){return RL.gen===3||RL.gen===2?'g3':RL.gen===5?'g5':'g4'}
function iv(id){const e=document.getElementById(id);return e?parseInt(e.value,10)||0:0}
function calcAll(){
  const dvo=$('#dv_out');if(dvo){const a=iv('dv_Atk'),d=iv('dv_Def'),s=iv('dv_Spe'),c=iv('dv_Spc');const ok=d===10&&s===10&&c===10&&[2,3,6,7,10,11,14,15].includes(a);dvo.className='out'+(ok?' yes':'');dvo.textContent=ok?'Shiny. These DVs produce a shiny Pokémon.':'Not shiny. Needs Def, Spe and Spc = 10 and Atk in 2, 3, 6, 7, 10, 11, 14, 15.'}
  const sco=$('#sc_out');if(sco){const gr=+$('#sc_gen').value,t=iv('sc_tid')&0xFFFF,s=iv('sc_sid')&0xFFFF,p=parseHex($('#sc_pid').value);
    if(p==null){sco.className='out';sco.textContent='Enter a PID in hex (up to 8 digits).'}
    else{const x=(t^s^(p>>>16)^(p&0xFFFF))>>>0;const thr=gr===3?8:16;const sh=x<thr;const kind=gr===8&&sh?(x===0?' (square)':' (star)'):'';const sv=gr===3?3:4;
      sco.className='out'+(sh?' yes':'');sco.innerHTML=`${sh?'Shiny'+kind:'Not shiny'} · shiny value ${x}<br>TSV ${(t^s)>>sv} · PSV ${((p>>>16)^(p&0xFFFF))>>sv} · Nature ${NATURES[p%25]} · Ability slot ${p&1}`}}
  const tvo=$('#tv_out');if(tvo){const t=iv('tv_tid')&0xFFFF,s=iv('tv_sid')&0xFFFF,tsv=(t^s)>>4;const ev=$('#tv_esv').value;let msg=`TSV ${tsv} (0–4095). Eggs whose ESV equals ${tsv} hatch shiny for this trainer.`;let ok=false;if(ev!==''){ok=+ev===tsv;msg+=ok?'<br>Match. This egg hatches shiny for this trainer.':`<br>No match (egg ESV ${+ev}).`}tvo.className='out'+(ok?' yes':'');tvo.innerHTML=msg}
  const g7=$('#g7_out');if(g7){const t=iv('g7_tid')&0xFFFF,s=iv('g7_sid')&0xFFFF;const full=((s<<16)|t)>>>0;g7.textContent=`Displayed ID ${String(full%1000000).padStart(6,'0')} · displayed SID ${String(Math.floor(full/1000000)).padStart(4,'0')} · TSV ${(t^s)>>4}`;
    const dt=$('#g7_dtid').value,ds=$('#g7_dsid').value;const o2=$('#g7_out2');if(dt!==''&&ds!==''){const f=(+ds)*1000000+(+dt);if(f>0xFFFFFFFF)o2.textContent='That combination is out of range.';else{const T=f%65536,Ss=Math.floor(f/65536);o2.textContent=`TID ${T} · SID ${Ss} · TSV ${(T^Ss)>>4}`}}}
  const s4=$('#s4_out');if(s4){const y=iv('s4_y'),mo=iv('s4_mo'),d=iv('s4_d'),h=iv('s4_h'),mi=iv('s4_mi'),s=iv('s4_s'),dl=iv('s4_dl');const ab=(mo*d+mi+s)&0xFF,cd=h&0xFF,ef=(dl+y-2000)&0xFFFF;const seed=((ab<<24)|(cd<<16)|ef)>>>0;s4.innerHTML=`Seed <b>${hex(seed)}</b> · AB ${hex(ab,2)} · CD ${hex(cd,2)} · EFGH ${hex(ef,4)}`}
}
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('#tab-rng [data-toolbox]'))calcAll()});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tool]');if(!t)return;

function findSeed4(){
  const out=$('#s4_find');const seed=parseHex($('#s4_t').value);const y=iv('s4_ty'),mf=+$('#s4_tm').value,minS=iv('s4_min');
  if(seed==null){out.innerHTML='<div class="out">Enter the target seed in hex.</div>';return}
  const ab=seed>>>24,cd=(seed>>>16)&0xFF,ef=seed&0xFFFF,delay=ef-(y-2000);
  if(cd>23){out.innerHTML=`<div class="out">Not reachable: the hour byte is ${cd}, above 23.</div>`;return}
  if(delay<0){out.innerHTML=`<div class="out">Not reachable in ${y}: the delay would be negative. Try an earlier year.</div>`;return}
  const res=[];const dim=(yy,m)=>new Date(yy,m,0).getDate();
  for(let mo=1;mo<=12&&res.length<30;mo++){if(mf&&mo!==mf)continue;
    for(let d=1;d<=dim(y,mo)&&res.length<30;d++)for(let mi=0;mi<60&&res.length<30;mi++)for(let s=minS;s<60;s++){if(((mo*d+mi+s)&0xFF)===ab){res.push([mo,d,mi,s]);break}}}
  out.innerHTML=`<div class="out">Hour ${cd} · delay ${delay}${delay<400?' (very short delays are hard to hit; consider a later year)':''}</div>`+
    (res.length?`<div class="tw" style="max-height:260px;overflow:auto"><table><thead><tr><th>Date</th><th class="num">Time</th><th class="num">Delay</th></tr></thead><tbody>${res.map(([mo,d,mi,s])=>`<tr><td>${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}</td><td class="num">${String(cd).padStart(2,'0')}:${String(mi).padStart(2,'0')}:${String(s).padStart(2,'0')}</td><td class="num">${delay}</td></tr>`).join('')}</tbody></table></div>`:'<p class="note">No matches with these filters.</p>');
}
function searchLcrng(){
  const out=$('#lc_out');let seed=parseHex($('#lc_seed').value);
  if(seed==null){out.innerHTML='<div class="out">Enter the seed in hex.</div>';return}
  const start=Math.max(1,iv('lc_start')),max=Math.min(5000000,Math.max(start,iv('lc_max'))),tid=iv('lc_tid')&0xFFFF,sid=iv('lc_sid')&0xFFFF,nat=+$('#lc_nat').value,shOnly=$('#lc_shiny').checked;
  let s=seed;for(let i=1;i<start;i++)s=lcrng(s);
  const rows=[];
  for(let f=start;f<=max&&rows.length<(shOnly?60:40);f++){
    const a=lcrng(s),b=lcrng(a),c=lcrng(b),d=lcrng(c);
    const lo=a>>>16,hi=b>>>16,pid=((hi<<16)|lo)>>>0;
    const sv=tid^sid^hi^lo,sh=sv<8;const n=pid%25;
    if((!shOnly||sh)&&(nat<0||n===nat)){const i1=c>>>16,i2=d>>>16;rows.push({f,pid,sh,n,ivs:[i1&31,(i1>>5)&31,(i1>>10)&31,(i2>>5)&31,(i2>>10)&31,i2&31]})}
    s=a;
  }
  out.innerHTML=rows.length?`<div class="tw" style="max-height:360px;overflow:auto"><table><thead><tr><th class="num">Frame</th><th class="num">PID</th><th>Nature</th><th class="num">HP/Atk/Def/SpA/SpD/Spe</th></tr></thead><tbody>${rows.map(r=>`<tr class="${r.sh?'hit':''}"><td class="num">${num(r.f)}</td><td class="num">${hex(r.pid)}${r.sh?' ★':''}</td><td>${NATURES[r.n]}</td><td class="num">${r.ivs.join(' / ')}</td></tr>`).join('')}</tbody></table></div><p class="note">Frame numbering follows PokéFinder's convention. Rows marked ★ are shiny for your IDs.</p>`:`<div class="out">No matching frames between ${num(start)} and ${num(max)}. Raise the search limit or loosen the nature filter.</div>`;
}

/* ---- timer ---- */
const GBA_MS=1000/59.7275, NDS_MS=1000/59.8261;
const TM={mode:'g4',running:false,ctx:null,raf:0,t0:0,phases:[],
  v:Object.assign({g3pre:5000,g3frame:1000,g3cal:0,g4delay:600,g4sec:50,g4dcal:0,g4scal:0,g5sec:50,g5cal:0,custom:'5000, 3000'},lsGet('shinyledger.timer')||{})};

  const f=(id,l,val,extra='')=>`<label class="f" for="tm_${id}">${l}<input id="tm_${id}" type="number" value="${val}" ${extra}></label>`;

    g5:f('g5sec','Target second',v.g5sec,'min="0" max="59"')+f('g5cal','Calibration (ms)',v.g5cal),
    custom:`<label class="f" for="tm_custom" style="grid-column:1/-1">Phases in ms, comma-separated<input id="tm_custom" value="${esc(v.custom)}"></label>`
  }[m];

  return `<div class="subnav" role="group" aria-label="Timer mode">${[['g3','Gen 3 frames'],['g4','Gen 4 delay'],['g5','Gen 5 seconds'],['custom','Custom']].map(([k,l])=>`<button data-tmode="${k}" aria-pressed="${k===m}">${l}</button>`).join('')}</div>
   <div class="tfields">${fields}</div>
   <div class="out" id="tm_phases"></div>
   <div class="clock" id="tm_clock">0:00.000</div>
   <div class="bar"><i id="tm_bar"></i></div>
   <div class="row"><button class="btn primary" id="tm_go">Start</button><span class="note" id="tm_ph"></span></div>
   ${hitLabel?`<div class="row"><input class="inp" id="tm_hit" type="number" placeholder="${hitLabel}" style="width:150px"><button class="btn" id="tm_cal">Update calibration</button></div>`:''}
   <p class="note" style="margin:0">Five beeps count down to the end of each phase; act on the last one. Browser timing is accurate to a few milliseconds, so calibrate with your actual hits as you would in EonTimer.</p>`;
}
function computePhases(){
  const v=TM.v;
  if(TM.mode==='g3')return [Math.max(0,v.g3pre),Math.max(0,Math.round((v.g3frame+v.g3cal)*GBA_MS))];
  if(TM.mode==='g4'){const p2=Math.max(0,Math.round((v.g4delay+v.g4dcal)*NDS_MS));let p1=v.g4sec*1000+v.g4scal+200-p2;while(p1<14000)p1+=60000;return [p1,p2]}
  if(TM.mode==='g5'){let p1=v.g5sec*1000+v.g5cal+200;while(p1<14000)p1+=60000;return [p1]}
  return String(v.custom).split(/[,\s]+/).map(x=>parseInt(x,10)).filter(x=>x>0).slice(0,8);
}
function timerRefresh(){
  const box=$('[data-toolbox="timer"]');if(!box)return;
  $$('input[id^="tm_"]',box).forEach(inp=>{const k=inp.id.slice(3);if(k in TM.v&&k!=='hit')TM.v[k]=k==='custom'?inp.value:(+inp.value||0)});
  lsSet('shinyledger.timer',TM.v);
  TM.phases=computePhases();
  $('#tm_phases').textContent=TM.phases.length?TM.phases.map((p,i)=>`Phase ${i+1}: ${(p/1000).toFixed(3)} s`).join(' · '):'Add at least one phase.';
}
function fmtClock(ms){ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000),r=Math.floor(ms%1000);return `${m}:${String(s).padStart(2,'0')}.${String(r).padStart(3,'0')}`}
function startTimer(){
  if(!TM.phases.length)return;
  Wake.auto++;Wake.sync();TM.woke=true;
  try{TM.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){TM.ctx=null}
  const now=performance.now();TM.t0=now;TM.running=true;
  if(TM.ctx){const base=TM.ctx.currentTime+0.05;let acc=0;TM.phases.forEach(p=>{acc+=p;for(let k=4;k>=0;k--){const at=(acc-k*500)/1000;if(at<0)continue;const o=TM.ctx.createOscillator(),gn=TM.ctx.createGain();o.frequency.value=k===0?1320:880;gn.gain.value=.12;o.connect(gn).connect(TM.ctx.destination);o.start(base+at);o.stop(base+at+0.06)}})}
  $('#tm_go').textContent='Stop';
  const total=TM.phases.reduce((a,b)=>a+b,0);
  const tick=()=>{if(!TM.running)return;const el=performance.now()-TM.t0;let acc=0,i=0;while(i<TM.phases.length&&el>acc+TM.phases[i]){acc+=TM.phases[i];i++}
    if(i>=TM.phases.length){stopTimer(true);return}
    const rem=acc+TM.phases[i]-el;const c=$('#tm_clock');if(!c){stopTimer();return}c.textContent=fmtClock(rem);$('#tm_bar').style.width=(el/total*100).toFixed(2)+'%';$('#tm_ph').textContent=`Phase ${i+1} of ${TM.phases.length}`;TM.raf=requestAnimationFrame(tick)};
  tick();
}
function stopTimer(done){if(TM.woke){TM.woke=false;Wake.auto=Math.max(0,Wake.auto-1);Wake.sync()}TM.running=false;cancelAnimationFrame(TM.raf);if(TM.ctx){const c=TM.ctx;setTimeout(()=>c.close().catch(()=>{}),done?300:0);TM.ctx=null}const g=$('#tm_go');if(g)g.textContent='Start';const c=$('#tm_clock');if(c)c.textContent=done?'0:00.000':fmtClock(TM.phases[0]||0);const b=$('#tm_bar');if(b)b.style.width=done?'100%':'0';const p=$('#tm_ph');if(p)p.textContent=done?'Done':''}
document.addEventListener('click',e=>{
  const mb=e.target.closest('[data-tmode]');if(mb){if(TM.running)stopTimer();TM.mode=mb.dataset.tmode;const box=$('[data-toolbox="timer"]');box.innerHTML=`<h3>${TOOLDEF.timer[0]}</h3>`+timerUI();timerRefresh();return}
  if(e.target.id==='tm_go'){timerRefresh();TM.running?stopTimer():startTimer()}
  if(e.target.id==='tm_cal'){const hit=$('#tm_hit').value;if(hit==='')return;const h=+hit,v=TM.v;
    if(TM.mode==='g3')v.g3cal+=v.g3frame-h;
    if(TM.mode==='g4')v.g4dcal+=v.g4delay-h;
    if(TM.mode==='g5')v.g5cal+=(v.g5sec-h)*1000;
    const box=$('[data-toolbox="timer"]');box.innerHTML=`<h3>${TOOLDEF.timer[0]}</h3>`+timerUI();timerRefresh();toast('Calibration updated')}
});
document.addEventListener('input',e=>{if(e.target.id&&e.target.id.startsWith('tm_')&&e.target.id!=='tm_hit'){if(!TM.running)timerRefresh()}});

/* ============ GUIDE ============ */
function renderGuide(){
  const el=$('#tab-guide');
  el.innerHTML=`
   <div><h2>Methods & encounter types</h2><p class="note">Every hunting method this tracker understands, by game, with base and best-case odds. Base odds are 1/8192 through Gen 5 and 1/4096 from Gen 6 on; each "roll" is one more check at the base rate.</p></div>
   ${GKEYS.map(gk=>{const g=GAMES[gk];const ms=methodsFor(gk).filter(m=>m.id!=='sr');return `<div class="panel pad" style="display:grid;gap:10px">
     <h3>${esc(g.n)} <span class="muted mono" style="font-size:.8rem;font-weight:500">Gen ${g.gen} · base ${fmtDen(1/g.base)}${g.charm?` · Shiny Charm +${g.charm} rolls`:' · no Shiny Charm'}</span></h3>
     <div class="tw stack"><table><thead><tr><th>Method</th><th class="num">Base</th><th class="num">Best case</th><th>Notes</th></tr></thead><tbody>
     ${ms.map(m=>{const b=bestFor(gk,m),o=oddsOf(gk,m.id,{},0);return `<tr><td><b>${esc(m.n)}</b></td><td class="num" data-label="Base">${o.target?'—':fmtDen(o.p)}</td><td class="num" data-label="Best case">${b.target?'Targeted':fmtDen(b.p)}</td><td>${esc(m.d)}</td></tr>`}).join('')}
     </tbody></table></div></div>`}).join('')}
   <div class="panel pad gen"><h3>Shiny locks</h3><p>Many story Pokémon can never be shiny, so check before you soft reset. From Gen 5 on, most box legendaries and key gifts are locked (Victini, Reshiram and Zekrom in Black/White; Xerneas and Yveltal in X/Y; Zacian and Zamazenta in Sword/Shield; Koraidon and Miraidon in Scarlet/Violet). Legends: Arceus locks every legendary and mythical plus the starters; Legends: Z-A locks legendaries, mythicals and story gifts apart from a few DLC legends.</p></div>
   <div class="panel pad gen"><h3>Encounter types you can track</h3><p>${ENC.map(esc).join(' · ')}</p></div>`;
}

/* ============ THEMES ============ */
function renderThemes(){
  const el=$('#tab-themes');
  const groups=[...new Set(SKINS.map(s=>s.group))];
  const card=(id,n,t,font)=>`<button class="sw" data-skin="${id}" aria-pressed="${S.skin===id}" style="background:${t.bg}">
     <div class="top" style="background:${t.chrome}"><i style="background:${t['chrome-ink']}"></i><i style="background:${t['chrome-ink']};opacity:.6"></i><i style="background:${t.spark}"></i></div>
     <div class="body"><div class="card" style="background:${t.panel};color:${t.ink};border:1px solid ${t.line}"><span style="font-family:${font};font-size:${font.includes('Press')?'.62rem':'.95rem'};font-weight:700">1,365</span><span style="width:12px;height:12px;border-radius:50%;background:${t.accent}"></span></div>
     <div style="display:flex;gap:4px"><span style="flex:2;height:6px;border-radius:3px;background:${t.accent}"></span><span style="flex:1;height:6px;border-radius:3px;background:${t.spark}"></span><span style="flex:1;height:6px;border-radius:3px;background:${t.muted}"></span></div></div>
     <div class="n">${esc(n)}</div></button>`;
  el.innerHTML=`
   <div><h2>Themes</h2><p class="note">${SKINS.length+1} palettes drawn from the handhelds, version colors, regions, Poké Balls and fan-favorite Pokémon. Your choice is remembered.</p></div>
   <div class="skingroup"><div class="eyebrow">Default</div><div class="skins">${card('system','Lab (follows your light/dark setting)',{bg:'#f3f4f6',chrome:'#16181d','chrome-ink':'#fff',panel:'#fff',ink:'#16181d',line:'#dde0e6',accent:'#cf3328',spark:'#e0a10b',muted:'#5b6270'},FONTS.chakra[0])}</div></div>
   ${groups.map(gr=>`<div class="skingroup"><div class="eyebrow">${esc(gr)}</div><div class="skins">${SKINS.filter(s=>s.group===gr).map(s=>card(s.id,s.n,s.t,FONTS[s.font][0])).join('')}</div></div>`).join('')}`;
  $$('.sw',el).forEach(b=>b.addEventListener('click',()=>applySkin(b.dataset.skin)));
}

/* ============ sync pill, account sheet, install ============ */
const SYNC_LABEL={local:'This device',signedout:'Sign in',saving:'Saving…',synced:'Synced',offline:'Offline',error:'Sync issue'};
function renderSync(){
  const b=$('#syncBtn');if(!b)return;
  b.dataset.s=Store.status;b.querySelector('span').textContent=SYNC_LABEL[Store.status]||'';
  b.title=Store.status==='offline'?'Offline: changes are saved on this device and will upload when you reconnect.':SYNC_LABEL[Store.status];
}
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e});
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function installBlock(){
  if(isStandalone())return `<p class="note" style="margin:0">Installed. You're using the home screen app.</p>`;
  if(installEvt)return `<button class="btn" type="button" id="acInstall">Install on this device</button>`;
  if(isIOS())return `<p class="note" style="margin:0">In Safari, tap <b>Share</b>, then <b>Add to Home Screen</b>.</p>`;
  return `<p class="note" style="margin:0">Use your browser menu: <b>Install app</b> or <b>Add to Home screen</b>.</p>`;
}
function openAccount(){
  const root=$('#modalRoot');
  const u=Store.user;
  let body;
  if(!sb){const c=window.SHINY_CONFIG||{};const why=!(c.supabaseUrl&&c.supabaseAnonKey)?'<b>config.js</b> doesn\'t have a Supabase URL and anon key yet. Add them, push to GitHub, then reopen the app.':!window.supabase?'The sync library (supabase.js) didn\'t load. Check that the vendor folder is in your repo.':'Sync could not start.';body=`<p class="note" style="margin:0">Sign-in isn't available, so hunts are saved on this device only.</p><p class="note" style="margin:0">${why}</p>`}
  else if(u){body=`<div class="kv" style="grid-template-columns:auto 1fr"><span class="muted">Signed in as</span><span style="text-align:right;overflow-wrap:anywhere">${esc(u.email||'')}</span><span class="muted">Status</span><span style="text-align:right">${esc(SYNC_LABEL[Store.status])}</span><span class="muted">Waiting to upload</span><span class="mono" style="text-align:right">${Store.outbox.size}</span></div>
      <div class="row"><button class="btn primary" type="button" id="acSync">Sync now</button><button class="btn ghost danger" type="button" id="acOut">Sign out</button></div>`}
  else{body=`<p class="note" style="margin:0">Sign in to keep your hunts in step across your phone and computer. No password: we email you a code.</p>
      <div id="acStep1" class="row" style="flex-wrap:nowrap"><input class="inp" id="acEmail" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com"><button class="btn primary" type="button" id="acSend">Send code</button></div>
      <div id="acStep2" class="row" style="flex-wrap:nowrap" hidden><input class="inp mono" id="acCode" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="Code from email"><button class="btn primary" type="button" id="acVerify">Sign in</button></div>
      <p class="note" id="acMsg" style="margin:0" aria-live="polite"></p>`}
  root.innerHTML=`<div class="scrim" id="acScrim"><div class="panel pad modal" role="dialog" aria-modal="true" aria-labelledby="acT">
    <div class="row" style="justify-content:space-between"><h2 id="acT">Account & app</h2><button class="btn ghost" type="button" id="acClose">Close</button></div>
    ${body}
    <div class="eyebrow">Home screen app</div>${installBlock()}
  </div></div>`;
  const close=()=>{root.innerHTML=''};
  $('#acClose').onclick=close;
  $('#acScrim').addEventListener('click',e=>{if(e.target.id==='acScrim')close()});
  const msg=t=>{const m=$('#acMsg');if(m)m.textContent=t};
  const ins=$('#acInstall');if(ins)ins.onclick=async()=>{const e=installEvt;installEvt=null;try{e.prompt();await e.userChoice}catch(x){}openAccount()};
  if($('#acSync'))$('#acSync').onclick=async()=>{await Store.flush();await Store.pull();openAccount()};
  if($('#acOut'))$('#acOut').onclick=async()=>{await Store.signOut();close();toast('Signed out. Hunts stay on this device.')};
  let email='';
  if($('#acSend'))$('#acSend').onclick=async()=>{
    email=$('#acEmail').value.trim();if(!/^\S+@\S+\.\S+$/.test(email)){msg('Enter a valid email address.');return}
    $('#acSend').disabled=true;msg('Sending…');
    const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}});
    $('#acSend').disabled=false;
    if(error){msg(error.message||'Could not send the code. Try again.');return}
    $('#acStep1').hidden=true;$('#acStep2').hidden=false;msg('Check '+email+' for your sign-in code.');$('#acCode').focus();
  };
  if($('#acVerify'))$('#acVerify').onclick=async()=>{
    const token=$('#acCode').value.replace(/\s/g,'');if(token.length<6){msg('Enter the code from the email.');return}
    $('#acVerify').disabled=true;msg('Signing in…');
    const {error}=await sb.auth.verifyOtp({email,token,type:'email'});
    $('#acVerify').disabled=false;
    if(error){msg('That code did not work. Check it or send a new one.');return}
    close();toast('Signed in. Syncing your hunts.');
  };
}
document.addEventListener('click',e=>{if(e.target.closest('#syncBtn'))openAccount()});

/* ============ boot ============ */
(function boot(){
  const sel=$('#skinSel');
  const groups=[...new Set(SKINS.map(s=>s.group))];
  sel.innerHTML=`<option value="system">Lab (system)</option>`+groups.map(g=>`<optgroup label="${esc(g)}">${SKINS.filter(s=>s.group===g).map(s=>`<option value="${s.id}">${esc(s.n)}</option>`).join('')}</optgroup>`).join('');
  sel.addEventListener('change',()=>applySkin(sel.value));
  const local=loadLocal();
  if(local.length){local.forEach(h=>S.hunts.set(h.id,h))}else{exampleHunts().forEach(h=>S.hunts.set(h.id,h));S.examples=true}
  S.sel=pickDefault();
  renderThemes();
  applySkin(lsGet(LS_SKIN)||'system',false);
  renderHunts();renderOdds();renderRng();renderGuide();
  const ui=lsGet(LS_UI);if(ui&&ui.wake){Wake.want=true;Wake.on()}const okTabs=['hunts','odds','rng','guide','themes'];
  const hashTab=(location.hash||'').slice(1);
  setTab(okTabs.includes(hashTab)?hashTab:(ui&&okTabs.includes(ui.tab)?ui.tab:'hunts'));
  renderSync();
  Store.connect();
  if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
